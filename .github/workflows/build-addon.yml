name: Build add-on image

on:
  pull_request:
    paths:
      - "addon/**"
      - ".github/workflows/build-addon.yml"
  push:
    branches:
      - main
    paths:
      - "addon/**"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

jobs:
  # On pull requests: prove the Dockerfile still builds, without publishing.
  verify:
    name: Verify build (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve base image for ${{ matrix.arch }}
        id: base
        run: |
          image=$(sed -n "s|^[[:space:]]*${{ matrix.arch }}:[[:space:]]*||p" addon/build.yaml)
          if [ -z "$image" ]; then
            echo "No build_from entry for ${{ matrix.arch }} in addon/build.yaml" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Base image: $image"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build add-on image
        uses: docker/build-push-action@v6
        with:
          context: addon
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
          push: false

  # On main / manual dispatch: build and publish to GHCR.
  publish:
    name: Publish ${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read add-on version
        id: addon
        run: |
          version=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' addon/config.yaml)
          if [ -z "$version" ]; then
            echo "Could not read version from addon/config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Add-on version: $version"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/addon \
            --image spoolman-importer-{arch} \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --addon
